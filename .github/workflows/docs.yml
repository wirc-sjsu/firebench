name: Documentation

on:
  pull_request:
  push:
    branches: [master, develop, dev-metrics]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Validate documentation examples and local links
        run: python -m pytest tests/unit/test_documentation.py
      - name: Build documentation with warnings as errors
        run: make docs-strict
      - name: Check external links
        run: make docs-linkcheck
