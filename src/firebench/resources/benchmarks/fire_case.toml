# Parameters of the benchmark cases defined outside FireBench (firebench.benchmarks.fire_case).
#
# A case definition (schema fb-case-v1) names this parameter set by `set` and `version`; it never
# carries a number that changes a score. Every threshold, normalization, and weight of a generic case
# is in this file, which FireBench reads from the installed package and from nowhere else. The
# values below are those of the Caldor case (FB001), except where a comment says otherwise.
#
# To change a parameter: edit this file in a FireBench commit and raise `version`, so that a case
# definition names the parameters it was reviewed with. Every key is required and an unknown key is
# refused when a case is loaded.

set = "fire_case"
version = "2026.1"

[group_weights]
# Weight of a group in the total score, by family.
building_damage = 1
burn_severity_cbi = 1
canopy_cover_loss = 1
fire_perimeters = 1
fire_radiative_power = 1
radar_plume = 1
weather_stations = 1

[building_damage]
# Weight of each binary structure-loss KPI in its group (accuracy, precision, recall, specificity,
# negative predictive value, F1 score).
kpi_weight = 1

[burn_severity_cbi]
# RAVG's four-class composite burn index (CBI4). Class 4 is "high", CBI >= 2.25, RAVG's own class
# bound (decision 1 of the generic-case work). Class 0 is no data: a cell that is no data in the
# observations or in the model is left out.
high_classes = [4]
other_classes = [1, 2, 3]
kpi_weight = 1

[canopy_cover_loss]
# RAVG's five-class canopy cover loss (CC5), an ordinal scale of how much canopy the fire consumed:
# 1 is 0 %, 2 >0-<25 %, 3 25-<50 %, 4 50-<75 %, 5 75-100 %. A cell is scored where LANDFIRE had canopy
# before the fire (the canopy height, base height, and bulk density all above 0, FB001's mask) and
# both the observations and the model give it one of `classes`: 9 (outside the burn area), 0 (no
# data), and any other value leave it out, on either side. The KPIs thus ask whether the class a
# model gives a burnt cell is right; whether it burns the right cells is the perimeters' question.
# Redefined without raising `version`: no definition of version 2026.1 holding this family was
# published, and the scores of the other families are unchanged.
classes = [1, 2, 3, 4, 5]
# Class 5 is "high" for the high-loss precision, recall, and F1, on the same cells.
high_classes = [5]
# The mean absolute class error and the mean class bias (in classes) at which their score is 50.
mae_at_score_50 = 1.0
bias_at_score_50 = 1.0
# Weight of each KPI in its group.
class_accuracy_weight = 1
within_one_class_accuracy_weight = 1
quadratic_weighted_kappa_weight = 1
macro_f1_weight = 1
mean_absolute_class_error_weight = 1
mean_class_bias_weight = 0
high_precision_weight = 0
high_recall_weight = 0
high_f1_weight = 1
evaluated_share_weight = 0

[fire_perimeters]
# Projections allowed for the areas and indices of a generic case (decision 3). FB001 computes its
# areas in EPSG:3310 and keeps it.
projections = ["EPSG:5070"]
# The relative error of a burnt area at which its score is 50.
area_relative_error_at_score_50 = 0.20
# A period is scored on at least this many perimeters.
min_perimeters = 2
# Weight of each KPI of a period in its group.
mean_jaccard_weight = 2
min_jaccard_weight = 1
max_jaccard_weight = 0
mean_dice_weight = 0
min_dice_weight = 0
max_dice_weight = 0
final_area_bias_weight = 1
area_rmse_weight = 1

[radar_plume]
# A model's passive tracer and wind against the radar's cross sections (firebench.standardize.radar,
# `radar_cross_section`). The observed plume is the radar plume mask of resources/radar.toml; the
# model's plume is where its tracer reaches this share of its largest value on the section at that
# time, so the tracer's scale never matters. Added without raising `version`, as canopy_cover_loss
# was: no definition of version 2026.1 holds this family, and the scores of the others are unchanged.
tracer_relative_threshold = 0.01
# A volume is scored against the model output time nearest its start, at most this far, in s.
max_time_offset = 300
# The cells of a section a rank correlation needs in one volume.
min_cells = 20
# Fall speed of the pyrometeors along the beam, in m s-1; not modelled yet.
fall_speed = 0.0
# Bins of height, in m, the model counts its plume cells over a radar's frame in, for the plume top
# of the sites a definition lists in `echo_top`. Added without raising `version`: a definition without
# `echo_top` scores as before.
top_bin = 100.0
# The radar's map grid over a frame, in degrees, both sides' plume top are put on (the grid of
# radar_composite): footprint and plume top map KPIs of the sites in `echo_top`.
map_resolution = 0.01
# Values of the errors at which their score is 50: plume top (m; on a section, and the error and
# bias of the plume top over a frame), plume centroid (m), radial velocity RMSE and bias (m s-1).
top_error_at_score_50 = 1000.0
centroid_error_at_score_50 = 2000.0
velocity_rmse_at_score_50 = 4.0
velocity_bias_at_score_50 = 2.0
# Distance between the plume-top-weighted centroids of both footprints on the map, in m, at which
# its score is 50.
footprint_centroid_at_score_50 = 5000.0
# Weight of each KPI in its group.
mask_iou_weight = 2
top_error_weight = 1
centroid_error_weight = 1
rank_correlation_weight = 1
velocity_rmse_weight = 1
velocity_bias_weight = 0
top_series_error_weight = 1
top_series_bias_weight = 0
footprint_iou_weight = 2
top_map_mae_weight = 1
top_map_bias_weight = 0
footprint_centroid_weight = 1

[fire_radiative_power]
# Satellite fire radiative power (firebench.standardize.frp_time_series: one total per overpass or
# scan, in the case's frame) against the band of FRP the model gives, `fire_radiative_power_lower`
# and `fire_radiative_power_upper` in MW. How a model turns its heat release into that band is the
# adapter's (WRF-SFIRE: the sensible heat flux divided by 5 to 10). An observation is scored when its
# start is in the period, it saw at least `min_observed_fraction` of its frame, it has an FRP total,
# and a model output time is at most `max_time_offset` s from it; the model's bounds are interpolated
# linearly in time to it. An observation where neither side has fire (an FRP total of 0 and an upper
# bound of 0) is left out. Added without raising `version`, as radar_plume was.
min_confidence = "nominal"
min_observed_fraction = 0.9
max_time_offset = 900
# A KPI is scored on at least this many observations.
min_observations = 5
# Weight of the KPIs pooled over every stream, and of the shares above and below the band.
all_weight = 0
above_weight = 0
below_weight = 0

# Observing systems: each has its own in-band KPI, with this weight, on the streams whose
# `instrument` it lists, so a system that looks often does not outweigh one that looks rarely. A
# stream whose instrument no system lists is not scored. A new system (a constellation such as
# FireSat) is a new table; moving an instrument between systems changes scores and raises `version`.
[fire_radiative_power.systems.geostationary]
label = "Geostationary"
instruments = ["ABI"]
weight = 1

[fire_radiative_power.systems.polar]
label = "Polar Orbiters"
instruments = ["VIIRS", "MODIS"]
weight = 1

[forecast_windows]
# The forecast windows `propose_case` offers: cycles at these UTC hours, this long, that hold at
# least `min_perimeters` perimeters (FB001's HRRR windows).
cycle_hours = [0, 6, 12, 18]
hours = 48
min_perimeters = 2

[weather_stations]
# Weight of a KPI in its group, by station set: trusted sources only, and all sources.
tso_weight = 1
all_weight = 0

# Station variables, in the order a case lists them. `unit` is the unit model and observations are
# compared in; `norm_m` is the error, in that unit, at which the score of a metric is 50
# (firebench.metrics.kpi_norm_symmetric_open_exponential). `metrics` is `standard` (MAE, RMSE,
# bias) or `wind_direction` (circular bias).
[weather_stations.variables.air_temperature]
label = "Air temp"
group_label = "Air Temp"
unit = "degC"
norm_m = 5
metrics = "standard"

[weather_stations.variables.relative_humidity]
label = "RH"
group_label = "RH"
unit = "percent"
norm_m = 15
metrics = "standard"

[weather_stations.variables.wind_speed]
label = "Wind Speed"
group_label = "Wind Speed"
unit = "m/s"
norm_m = 5
metrics = "standard"

[weather_stations.variables.wind_direction]
label = "Wind Direction"
group_label = "Wind Direction"
unit = "degree"
norm_m = 45
metrics = "wind_direction"

[weather_stations.variables.fuel_moisture_content_10h]
label = "FMC 10h"
group_label = "FMC 10h"
unit = "percent"
norm_m = 5
metrics = "standard"
