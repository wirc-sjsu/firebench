# Parameters of the weather radar readers (firebench.standardize.radar).
#
# The file is read from the installed package and from nowhere else, so the FireBench version or
# commit of a result identifies its parameters. A change that alters a reading raises `version`.

set = "radar"
version = "2026.2"

[plume_mask]
# Adapted from the pyrometeor mask of Krishna et al. (2024): reflectivity at least `min_dbz`, in dBZ,
# and a correlation coefficient strictly between the bounds of `rhohv_range`. `min_dbz` was 10 before
# version 2026.2: on the Hawk Fire's KRGX sections, 93 % of the cells where a WRF-SFIRE tracer saw a
# plume and the mask did not were below 10 dBZ, half of them below 5, and the IoU of both masks levels
# off near 0 dBZ, below which the radar's plume grows faster than its overlap with the model's.
min_dbz = 5.0
rhohv_range = [0.2, 0.9]

[sections]
# Cross sections (radar_cross_section): the spacing of the grid on the plane, in m, ...
min_spacing = 100.0
max_spacing = 2000.0
# ... the longest side of the rectangle, in m, the largest span of altitudes in it, in m, and the
# most cells it may hold.
max_length = 300000.0
max_span = 25000.0
max_cells = 200000
# Two sweeps further apart than this, in degree, leave the cells between them without a value.
max_elevation_gap = 2.0
